[project]
name = "dodman-billing"
version = "0.1.2"
description = "Shared Paystack subscription billing for Dodman Group products (FastAPI + asyncpg)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "reportlab>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dodman_billing*"]
